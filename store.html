
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>DOKKANI | متجر</title>

<style>
:root{
  --navy:#071426;
  --navy2:#10243d;
  --gold:#d6ad55;
  --gold2:#f0d28b;
  --bg:#f4f6fa;
  --muted:#8490a3;
  --border:#e8ebf1;
  --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:var(--bg);
  color:#172338;
  min-height:100vh;
}

header{
  background:linear-gradient(120deg,#071426,#10243d);
  border-bottom:3px solid var(--gold);
  padding:17px 18px;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  color:white;
  font-size:20px;
  letter-spacing:1px;
}

.logo{
  width:43px;
  height:43px;
  border:1px solid var(--gold);
  border-radius:12px;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-size:25px;
  font-weight:bold;
}

.powered{
  color:var(--gold2);
  font-size:12px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:28px 18px;
}

.loading,.message{
  background:white;
  border-radius:16px;
  padding:30px 20px;
  text-align:center;
  line-height:1.8;
}

.error{color:#b42318}

/* واجهة المتجر */

.store-card{
  display:none;
}

.store-hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(120deg,#071426,#142b47);
  border:1px solid #263d57;
  border-radius:20px;
  padding:35px 22px;
  text-align:center;
  color:white;
  box-shadow:0 12px 35px #07142615;
}

.store-icon{
  width:78px;
  height:78px;
  margin:auto;
  border-radius:22px;
  background:#10243d;
  border:2px solid var(--gold);
  display:grid;
  place-items:center;
  font-size:34px;
}

.store-card h1{
  margin-top:17px;
  font-size:29px;
  color:white;
}

.slug{
  color:#c3ccda;
  margin-top:9px;
  font-size:13px;
  direction:ltr;
}

.store-description{
  max-width:600px;
  margin:14px auto 0;
  color:#d5dce6;
  font-size:14px;
  line-height:1.9;
}

.badge{
  display:inline-block;
  margin-top:16px;
  padding:8px 15px;
  border-radius:30px;
  background:#173d35;
  color:#9be0b9;
  border:1px solid #28634f;
  font-size:12px;
}

/* المنتجات */

.products-section{
  margin-top:35px;
}

.products-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:15px;
}

.products-heading h2{
  font-size:22px;
  color:var(--navy);
}

.count{
  font-size:12px;
  color:var(--muted);
  background:white;
  padding:8px 12px;
  border-radius:20px;
  border:1px solid var(--border);
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
  margin-top:20px;
}

.product{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 25px #07142612;
}

.product-image{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#eef1f6;
  display:block;
}

.image-placeholder{
  height:210px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#eef1f6,#e2e7ef);
  color:#9aa6b7;
  font-size:42px;
}

.product-info{
  padding:17px;
}

.product-info h3{
  font-size:17px;
  color:var(--navy);
  margin-bottom:10px;
  overflow-wrap:anywhere;
}

.product-description{
  font-size:13px;
  color:var(--muted);
  line-height:1.8;
  min-height:44px;
  overflow-wrap:anywhere;
}

.product-price{
  color:#987326;
  font-size:21px;
  font-weight:bold;
  margin-top:15px;
}

.order-button{
  display:block;
  text-align:center;
  margin:0 16px 16px;
  padding:13px;
  background:var(--navy);
  color:var(--gold2);
  border:1px solid var(--gold);
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:calc(100% - 32px);
  transition:.2s;
}

.order-button:hover{
  background:var(--navy2);
}

.empty-products,.error-products{
  margin-top:20px;
  padding:27px;
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--muted);
  text-align:center;
  line-height:1.9;
}

/* نافذة الطلب */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:#071426c9;
  padding:15px;
  align-items:center;
  justify-content:center;
}

.modal.show{display:flex}

.modal-content{
  background:white;
  width:100%;
  max-width:440px;
  padding:25px;
  border-radius:18px;
  max-height:90vh;
  overflow:auto;
  box-shadow:0 20px 60px #0004;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-header h2{
  color:var(--navy);
  font-size:21px;
}

.close-btn{
  border:0;
  background:#f1f3f6;
  border-radius:9px;
  width:36px;
  height:36px;
  font-size:22px;
  cursor:pointer;
}

.selected-product{
  background:#f5f6f9;
  border:1px solid var(--border);
  padding:14px;
  border-radius:11px;
  margin-bottom:17px;
  line-height:1.8;
  font-size:14px;
}

.modal-content label{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  font-weight:bold;
  color:var(--navy);
}

.modal-content input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:white;
}

.modal-content input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px #d6ad5520;
}

.submit-order{
  width:100%;
  margin-top:21px;
  padding:14px;
  border:1px solid var(--gold);
  border-radius:10px;
  background:var(--navy);
  color:var(--gold2);
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.submit-order:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.order-message{
  margin-top:13px;
  text-align:center;
  font-size:13px;
  line-height:1.8;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  font-size:12px;
  border-top:1px solid var(--border);
  margin-top:30px;
}

@media(max-width:750px){
  .products-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .product-image,.image-placeholder{height:165px}
  .product-info{padding:13px}
  .product-info h3{font-size:15px}
  .product-price{font-size:18px}
  .store-hero{padding:28px 15px}
  .store-card h1{font-size:25px}
}

@media(max-width:390px){
  .products-grid{grid-template-columns:1fr}
  .product-image,.image-placeholder{height:220px}
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="brand">
      <div class="logo">D</div>
      <strong>DOKKANI</strong>
    </div>
    <div class="powered">POWERED BY SZ11</div>
  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    جارٍ تحميل المتجر...
  </div>

  <div id="storeCard" class="store-card">

    <section class="store-hero">
      <div class="store-icon">🏪</div>
      <h1 id="storeName"></h1>
      <div class="slug" id="storeSlug"></div>
      <p class="store-description" id="storeDescription"></p>
      <div class="badge">✓ متجر مفعّل</div>
    </section>

    <section class="products-section">
      <div class="products-heading">
        <h2>اكتشف منتجاتنا</h2>
        <span class="count" id="productsCount">0 منتجات</span>
      </div>

      <div id="productsGrid" class="products-grid"></div>

      <div id="productsMessage" class="empty-products">
        جارٍ تحميل المنتجات...
      </div>
    </section>

  </div>
</main>

<!-- نافذة تقديم الطلب -->
<div class="modal" id="orderModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>إتمام الطلب</h2>
      <button class="close-btn" id="closeModal" type="button">×</button>
    </div>

    <div class="selected-product" id="selectedProduct"></div>

    <form id="orderForm">

      <label for="customerName">الاسم الكامل</label>
      <input id="customerName" required minlength="2" maxlength="80"
        placeholder="أدخل اسمك">

      <label for="customerPhone">رقم الهاتف</label>
      <input id="customerPhone" type="tel" required minlength="8"
        maxlength="20" placeholder="رقم هاتفك">

      <label for="customerCity">المدينة</label>
      <input id="customerCity" required minlength="2" maxlength="60"
        placeholder="مثلاً: جرسيف">

      <label for="quantity">الكمية</label>
      <input id="quantity" type="number" min="1" max="100"
        step="1" value="1" required>

      <button class="submit-order" id="submitOrder" type="submit">
        تأكيد الطلب
      </button>

      <p class="order-message" id="orderMessage" role="status"></p>
    </form>

  </div>
</div>

<footer>
  DOKKANI © 2026 — A project by SZ11
</footer>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const loading = document.getElementById("loading");
const storeCard = document.getElementById("storeCard");
const storeName = document.getElementById("storeName");
const storeSlug = document.getElementById("storeSlug");
const storeDescription = document.getElementById("storeDescription");
const productsGrid = document.getElementById("productsGrid");
const productsMessage = document.getElementById("productsMessage");
const productsCount = document.getElementById("productsCount");

const orderModal = document.getElementById("orderModal");
const orderForm = document.getElementById("orderForm");
const selectedProduct = document.getElementById("selectedProduct");
const orderMessage = document.getElementById("orderMessage");
const submitOrder = document.getElementById("submitOrder");

let currentStoreId = "";
let currentOwnerId = "";
let selectedOrderProduct = null;

function showError(message){
  loading.textContent = message;
  loading.classList.add("error");
}

function openOrder(product, productId){

  selectedOrderProduct = {
    ...product,
    productId
  };

  selectedProduct.textContent =
    product.name + " — " +
    Number(product.price).toLocaleString("fr-MA") + " DH";

  orderMessage.textContent = "";
  submitOrder.disabled = false;
  submitOrder.textContent = "تأكيد الطلب";

  orderForm.reset();
  document.getElementById("quantity").value = 1;

  orderModal.classList.add("show");
}

function closeOrder(){
  orderModal.classList.remove("show");
  selectedOrderProduct = null;
}

document.getElementById("closeModal")
  .addEventListener("click", closeOrder);

orderModal.addEventListener("click",(event)=>{
  if(event.target === orderModal){
    closeOrder();
  }
});

async function loadProducts(ownerId){

  productsGrid.replaceChildren();
  productsMessage.style.display = "block";
  productsMessage.classList.remove("error");
  productsMessage.textContent = "جارٍ تحميل المنتجات...";

  try{

    const productsQuery = query(
      collection(db,"products"),
      where("ownerId","==",ownerId),
      where("status","==","active")
    );

    const snapshot = await getDocs(productsQuery);

    productsCount.textContent = snapshot.size + " منتجات";

    if(snapshot.empty){
      productsMessage.textContent =
        "لا توجد منتجات منشورة حالياً.";
      return;
    }

    productsMessage.style.display = "none";

    snapshot.forEach((productDoc)=>{

      const product = productDoc.data();

      const card = document.createElement("article");
      card.className = "product";

      if(product.imageUrl){

        const img = document.createElement("img");
        img.className = "product-image";
        img.alt = product.name || "صورة المنتج";
        img.loading = "lazy";
        img.src = product.imageUrl;

        img.onerror = ()=>{
          const placeholder = document.createElement("div");
          placeholder.className = "image-placeholder";
          placeholder.textContent = "📦";
          img.replaceWith(placeholder);
        };

        card.appendChild(img);

      }else{

        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "📦";
        card.appendChild(placeholder);

      }

      const info = document.createElement("div");
      info.className = "product-info";

      const name = document.createElement("h3");
      name.textContent = product.name || "منتج بدون اسم";

      const description = document.createElement("p");
      description.className = "product-description";
      description.textContent =
        product.description || "لا يوجد وصف لهذا المنتج.";

      const price = document.createElement("div");
      price.className = "product-price";

      const numericPrice = Number(product.price);

      price.textContent =
        Number.isFinite(numericPrice)
          ? numericPrice.toLocaleString("fr-MA") + " DH"
          : String(product.price || "السعر غير محدد");

      info.append(name,description,price);

      const orderBtn = document.createElement("button");
      orderBtn.type = "button";
      orderBtn.className = "order-button";
      orderBtn.textContent = "اطلب الآن";

      orderBtn.addEventListener("click",()=>{
        openOrder(product,productDoc.id);
      });

      card.append(info,orderBtn);
      productsGrid.appendChild(card);

    });

  }catch(error){

    console.error("Products error:",error);

    productsMessage.textContent =
      "تعذر تحميل المنتجات. " +
      (error.code || error.message || "");

    productsMessage.classList.add("error");

  }
}

/* تسجيل الطلب */
orderForm.addEventListener("submit",async(event)=>{

  event.preventDefault();

  if(!selectedOrderProduct || !currentStoreId || !currentOwnerId){
    orderMessage.textContent = "تعذر تحديد المنتج أو المتجر.";
    return;
  }

  const customerName =
    document.getElementById("customerName").value.trim();

  const customerPhone =
    document.getElementById("customerPhone").value.trim();

  const customerCity =
    document.getElementById("customerCity").value.trim();

  const quantity =
    Number(document.getElementById("quantity").value);

  const product = selectedOrderProduct;
  const price = Number(product.price);

  if(!customerName || !customerPhone || !customerCity ||
     customerName.length < 2 || customerPhone.length < 8 ||
     customerCity.length < 2 || !Number.isInteger(quantity) ||
     quantity < 1 || quantity > 100 ||
     !Number.isFinite(price) || price <= 0){

    orderMessage.textContent = "يرجى التأكد من صحة جميع البيانات.";
    return;
  }

  submitOrder.disabled = true;
  submitOrder.textContent = "جارٍ تسجيل الطلب...";
  orderMessage.textContent = "";

  try{

    await addDoc(collection(db,"orders"),{

      storeId: currentStoreId,
      ownerId: currentOwnerId,
      productId: product.productId,
      productName: String(product.name || "منتج"),
      price: price,
      quantity: quantity,

      customerName: customerName,
      customerPhone: customerPhone,
      customerCity: customerCity,

      status: "new",
      createdAt: serverTimestamp()

    });

    const total = price * quantity;

    const whatsappMessage =
      `السلام عليكم، لقد سجلت طلباً عبر DOKKANI.\n\n` +
      `المنتج: ${product.name}\n` +
      `السعر: ${price} درهم\n` +
      `الكمية: ${quantity}\n` +
      `المجموع: ${total} درهم\n\n` +
      `اسم الزبون: ${customerName}\n` +
      `الهاتف: ${customerPhone}\n` +
      `المدينة: ${customerCity}`;

    const phone = String(product.whatsapp || "").replace(/\D/g,"");

    if(phone.length >= 10 && phone.length <= 15){

      orderMessage.textContent = "تم تسجيل الطلب! جارٍ فتح واتساب...";

      const whatsappUrl =
        "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(whatsappMessage);

      window.location.href = whatsappUrl;

    }else{

      orderMessage.textContent =
        "تم تسجيل طلبك بنجاح، لكن رقم واتساب البائع غير صالح.";

      submitOrder.textContent = "تم تسجيل الطلب";

    }

  }catch(error){

    console.error("Order error:",error);

    orderMessage.textContent =
      "تعذر تسجيل الطلب: " +
      (error.code || error.message || "خطأ غير معروف");

    submitOrder.disabled = false;
    submitOrder.textContent = "إعادة المحاولة";

  }

});

async function loadStore(){

  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  if(!slug){
    showError("لم يتم تحديد رابط المتجر.");
    return;
  }

  try{

    const storesQuery = query(
      collection(db,"stores"),
      where("slug","==",slug),
      where("status","==","active")
    );

    const snapshot = await getDocs(storesQuery);

    if(snapshot.empty){
      showError("هذا المتجر غير موجود أو غير مفعّل.");
      return;
    }

    const storeDoc = snapshot.docs[0];
    const store = storeDoc.data();

    currentStoreId = storeDoc.id;
    currentOwnerId = store.ownerId || "";

    storeName.textContent = store.name || "متجر DOKKANI";
    storeSlug.textContent = "DOKKANI / " + store.slug;

    storeDescription.textContent =
      store.description || "مرحباً بكم في متجرنا على DOKKANI.";

    document.title = (store.name || "متجر") + " | DOKKANI";

    loading.style.display = "none";
    storeCard.style.display = "block";

    if(!currentOwnerId){
      productsMessage.textContent =
        "تعذر تحديد صاحب المتجر.";
      return;
    }

    await loadProducts(currentOwnerId);

  }catch(error){

    console.error("Store error:",error);

    showError(
      "حدث خطأ أثناء تحميل المتجر: " +
      (error.code || error.message || "")
    );

  }
}

loadStore();

</script>

</body>
</html>
