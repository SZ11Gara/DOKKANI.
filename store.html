
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOKKANI | متجر</title>

<style>
:root{
  --navy:#071426;
  --navy2:#10243d;
  --gold:#d6ad55;
  --gold2:#f0d28b;
  --bg:#f3f5f9;
  --muted:#8490a3;
  --border:#e8ebf1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Tahoma,sans-serif;
  background:var(--bg);
  color:#172338;
}
header{
  background:var(--navy);
  border-bottom:3px solid var(--gold);
  padding:18px;
}
.header-content{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;color:white}
.logo{
  width:42px;height:42px;border:1px solid var(--gold);
  border-radius:11px;display:grid;place-items:center;
  color:var(--gold);font-weight:bold
}
.powered{color:var(--gold2);font-size:12px}
.container{max-width:1000px;margin:auto;padding:30px 18px}
.loading,.message{
  background:white;border-radius:15px;padding:30px 20px;
  text-align:center;line-height:1.8
}
.store-card{
  display:none;background:white;border-radius:18px;
  padding:28px;box-shadow:0 5px 25px #00000008;
  text-align:center
}
.store-icon{
  width:80px;height:80px;margin:auto;border-radius:20px;
  background:var(--navy);border:2px solid var(--gold);
  display:grid;place-items:center;font-size:34px
}
.store-card h1{margin-top:17px;font-size:28px;color:var(--navy)}
.slug{color:var(--muted);margin-top:8px}
.badge{
  display:inline-block;margin-top:15px;padding:8px 14px;
  border-radius:20px;background:#e5f7eb;color:#187443;font-size:12px
}
.products-section{margin-top:35px;text-align:right}
.products-heading{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap
}
.products-heading h2{font-size:21px}
.count{font-size:12px;color:var(--muted)}
.products-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;margin-top:18px
}
.product{
  background:white;border:1px solid var(--border);
  border-radius:14px;overflow:hidden;text-align:right;
}
.product-image{
  width:100%;height:190px;object-fit:cover;
  background:#eef1f6;display:block
}
.product-info{padding:15px}
.product-info h3{font-size:16px;color:var(--navy);margin-bottom:9px}
.product-description{
  font-size:12px;color:var(--muted);
  line-height:1.7;min-height:38px;overflow-wrap:anywhere
}
.product-price{
  color:#987326;font-size:19px;font-weight:bold;
  margin-top:14px
}
.order-button{
  display:block;text-align:center;
  margin:0 15px 15px;padding:12px;
  background:var(--navy);color:var(--gold2);
  border:1px solid var(--gold);
  border-radius:9px;text-decoration:none;
  font-weight:bold;cursor:pointer;width:calc(100% - 30px);
}
.order-button:hover{background:var(--navy2)}
.empty-products,.error-products{
  margin-top:18px;padding:25px;background:#f8f9fc;
  border-radius:12px;color:var(--muted);text-align:center;
  line-height:1.8
}
.error{color:#b42318}
footer{
  text-align:center;padding:30px 15px;
  color:var(--muted);font-size:12px
}

/* نافذة الطلب */
.modal{
  display:none;position:fixed;inset:0;z-index:1000;
  background:#071426b8;padding:18px;
  align-items:center;justify-content:center;
}
.modal.show{display:flex}
.modal-content{
  background:white;width:100%;max-width:430px;
  padding:25px;border-radius:17px;
  max-height:90vh;overflow:auto;
}
.modal-header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:20px;
}
.modal-header h2{color:var(--navy);font-size:21px}
.close-btn{
  border:0;background:#f1f3f6;border-radius:8px;
  width:34px;height:34px;font-size:21px;cursor:pointer;
}
.selected-product{
  background:#f6f7fa;padding:13px;
  border-radius:10px;margin-bottom:17px;
  line-height:1.8;font-size:14px;
}
.modal-content label{
  display:block;margin:13px 0 7px;
  font-size:13px;font-weight:bold;color:var(--navy);
}
.modal-content input{
  width:100%;padding:12px;
  border:1px solid var(--border);
  border-radius:9px;font-size:15px;
  outline:none;
}
.modal-content input:focus{
  border-color:var(--gold);
}
.submit-order{
  width:100%;margin-top:20px;padding:14px;
  border:0;border-radius:9px;
  background:var(--navy);color:var(--gold2);
  font-size:15px;font-weight:bold;cursor:pointer;
}
.submit-order:disabled{opacity:.6;cursor:not-allowed}
.order-message{
  margin-top:12px;text-align:center;
  font-size:13px;line-height:1.7;
}
@media(max-width:700px){
  .products-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .product-image{height:155px}
  .store-card{padding:20px 14px}
}
@media(max-width:380px){
  .products-grid{grid-template-columns:1fr}
  .product-image{height:210px}
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="brand">
      <div class="logo">D</div>
      <strong>DOKKANI</strong>
    </div>
    <div class="powered">powered by SZ11</div>
  </div>
</header>

<div class="container">

  <div id="loading" class="loading">
    جارٍ تحميل المتجر...
  </div>

  <div id="storeCard" class="store-card">
    <div class="store-icon">🏪</div>
    <h1 id="storeName"></h1>
    <div class="slug" id="storeSlug"></div>
    <div class="badge">✓ متجر مفعّل</div>

    <section class="products-section">
      <div class="products-heading">
        <h2>منتجات المتجر</h2>
        <span class="count" id="productsCount">0 منتجات</span>
      </div>

      <div id="productsGrid" class="products-grid"></div>

      <div id="productsMessage" class="empty-products">
        جارٍ تحميل المنتجات...
      </div>
    </section>
  </div>

</div>

<!-- نافذة تقديم الطلب -->
<div class="modal" id="orderModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>إتمام الطلب</h2>
      <button class="close-btn" id="closeModal" type="button">×</button>
    </div>

    <div class="selected-product" id="selectedProduct"></div>

    <form id="orderForm">
      <label for="customerName">الاسم الكامل</label>
      <input id="customerName" required minlength="2" maxlength="80"
        placeholder="أدخل اسمك">

      <label for="customerPhone">رقم الهاتف</label>
      <input id="customerPhone" type="tel" required minlength="8"
        maxlength="20" placeholder="رقم هاتفك">

      <label for="customerCity">المدينة</label>
      <input id="customerCity" required minlength="2" maxlength="60"
        placeholder="مثلاً: جرسيف">

      <label for="quantity">الكمية</label>
      <input id="quantity" type="number" min="1" max="100"
        step="1" value="1" required>

      <button class="submit-order" id="submitOrder" type="submit">
        تأكيد الطلب
      </button>

      <p class="order-message" id="orderMessage" role="status"></p>
    </form>
  </div>
</div>

<footer>
  DOKKANI © 2026 — A project by SZ11
</footer>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const loading = document.getElementById("loading");
const storeCard = document.getElementById("storeCard");
const storeName = document.getElementById("storeName");
const storeSlug = document.getElementById("storeSlug");
const productsGrid = document.getElementById("productsGrid");
const productsMessage = document.getElementById("productsMessage");
const productsCount = document.getElementById("productsCount");

const orderModal = document.getElementById("orderModal");
const orderForm = document.getElementById("orderForm");
const selectedProduct = document.getElementById("selectedProduct");
const orderMessage = document.getElementById("orderMessage");
const submitOrder = document.getElementById("submitOrder");

let currentStoreId = "";
let currentOwnerId = "";
let selectedOrderProduct = null;

function showError(message){
  loading.textContent = message;
  loading.classList.add("error");
}

function openOrder(product, productId){

  selectedOrderProduct = {
    ...product,
    productId
  };

  selectedProduct.textContent =
    product.name + " — " +
    Number(product.price).toLocaleString("fr-MA") + " DH";

  orderMessage.textContent = "";
  orderForm.reset();
  document.getElementById("quantity").value = 1;

  orderModal.classList.add("show");
}

function closeOrder(){
  orderModal.classList.remove("show");
  selectedOrderProduct = null;
}

document.getElementById("closeModal")
  .addEventListener("click", closeOrder);

orderModal.addEventListener("click", (event)=>{
  if(event.target === orderModal){
    closeOrder();
  }
});

async function loadProducts(ownerId){

  productsGrid.replaceChildren();
  productsMessage.style.display = "block";
  productsMessage.textContent = "جارٍ تحميل المنتجات...";

  try{

    const productsQuery = query(
      collection(db,"products"),
      where("ownerId","==",ownerId),
      where("status","==","active")
    );

    const snapshot = await getDocs(productsQuery);

    productsCount.textContent = snapshot.size + " منتجات";

    if(snapshot.empty){
      productsMessage.textContent =
        "لا توجد منتجات منشورة حالياً.";
      return;
    }

    productsMessage.style.display = "none";

    snapshot.forEach((productDoc)=>{

      const product = productDoc.data();

      const card = document.createElement("article");
      card.className = "product";

      const img = document.createElement("img");
      img.className = "product-image";
      img.alt = product.name || "صورة المنتج";
      img.loading = "lazy";

      if(product.imageUrl){
        img.src = product.imageUrl;
        img.onerror = () => {
          img.style.display = "none";
        };
      }else{
        img.style.display = "none";
      }

      const info = document.createElement("div");
      info.className = "product-info";

      const name = document.createElement("h3");
      name.textContent = product.name || "منتج بدون اسم";

      const description = document.createElement("p");
      description.className = "product-description";
      description.textContent =
        product.description || "لا يوجد وصف لهذا المنتج.";

      const price = document.createElement("div");
      price.className = "product-price";

      const numericPrice = Number(product.price);
      price.textContent =
        Number.isFinite(numericPrice)
          ? numericPrice.toLocaleString("fr-MA") + " DH"
          : String(product.price || "السعر غير محدد");

      info.append(name,description,price);

      const orderBtn = document.createElement("button");
      orderBtn.type = "button";
      orderBtn.className = "order-button";
      orderBtn.textContent = "اطلب الآن";

      orderBtn.addEventListener("click", ()=>{
        openOrder(product, productDoc.id);
      });

      card.append(img,info,orderBtn);
      productsGrid.appendChild(card);

    });

  }catch(error){

    console.error("Products error:",error);

    productsMessage.textContent =
      "تعذر تحميل المنتجات. " +
      (error.code || error.message || "");

    productsMessage.classList.add("error");

  }
}

/* حفظ الطلب */
orderForm.addEventListener("submit", async (event)=>{

  event.preventDefault();

  if(!selectedOrderProduct || !currentStoreId || !currentOwnerId){
    orderMessage.textContent = "تعذر تحديد المنتج أو المتجر.";
    return;
  }

  const customerName =
    document.getElementById("customerName").value.trim();

  const customerPhone =
    document.getElementById("customerPhone").value.trim();

  const customerCity =
    document.getElementById("customerCity").value.trim();

  const quantity =
    Number(document.getElementById("quantity").value);

  const product = selectedOrderProduct;
  const price = Number(product.price);

  if(!customerName || !customerPhone || !customerCity ||
     customerName.length < 2 || customerPhone.length < 8 ||
     customerCity.length < 2 || !Number.isInteger(quantity) ||
     quantity < 1 || quantity > 100 ||
     !Number.isFinite(price) || price <= 0){

    orderMessage.textContent = "يرجى التأكد من صحة جميع البيانات.";
    return;
  }

  submitOrder.disabled = true;
  submitOrder.textContent = "جارٍ تسجيل الطلب...";
  orderMessage.textContent = "";

  try{

    await addDoc(collection(db,"orders"),{

      storeId: currentStoreId,
      ownerId: currentOwnerId,
      productId: product.productId,
      productName: String(product.name || "منتج"),
      price: price,
      quantity: quantity,

      customerName: customerName,
      customerPhone: customerPhone,
      customerCity: customerCity,

      status: "new",
      createdAt: serverTimestamp()

    });

    const total = price * quantity;

    const whatsappMessage =
      `السلام عليكم، لقد سجلت طلباً عبر DOKKANI.\n\n` +
      `المنتج: ${product.name}\n` +
      `السعر: ${price} درهم\n` +
      `الكمية: ${quantity}\n` +
      `المجموع: ${total} درهم\n\n` +
      `اسم الزبون: ${customerName}\n` +
      `الهاتف: ${customerPhone}\n` +
      `المدينة: ${customerCity}`;

    const phone = String(product.whatsapp || "").replace(/\D/g,"");

    if(phone.length >= 10 && phone.length <= 15){

      orderMessage.textContent = "تم تسجيل الطلب! جارٍ فتح واتساب...";

      const whatsappUrl =
        "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(whatsappMessage);

      window.location.href = whatsappUrl;

    }else{

      orderMessage.textContent =
        "تم تسجيل طلبك بنجاح، لكن رقم واتساب البائع غير صالح.";

      submitOrder.textContent = "تم تسجيل الطلب";
    }

  }catch(error){

    console.error("Order error:",error);

    orderMessage.textContent =
      "تعذر تسجيل الطلب: " +
      (error.code || error.message || "خطأ غير معروف");

    submitOrder.disabled = false;
    submitOrder.textContent = "إعادة المحاولة";

  }

});

async function loadStore(){

  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  if(!slug){
    showError("لم يتم تحديد رابط المتجر.");
    return;
  }

  try{

    const storesQuery = query(
      collection(db,"stores"),
      where("slug","==",slug),
      where("status","==","active")
    );

    const snapshot = await getDocs(storesQuery);

    if(snapshot.empty){
      showError("هذا المتجر غير موجود أو غير مفعّل.");
      return;
    }

    const storeDoc = snapshot.docs[0];
    const store = storeDoc.data();

    currentStoreId = storeDoc.id;
    currentOwnerId = store.ownerId || "";

    storeName.textContent = store.name || "متجر DOKKANI";
    storeSlug.textContent = "dokkani.ma/" + store.slug;

    document.title = (store.name || "متجر") + " | DOKKANI";

    loading.style.display = "none";
    storeCard.style.display = "block";

    if(!currentOwnerId){
      productsMessage.textContent =
        "تعذر تحديد صاحب المتجر.";
      return;
    }

    await loadProducts(currentOwnerId);

  }catch(error){

    console.error("Store error:",error);

    showError(
      "حدث خطأ أثناء تحميل المتجر: " +
      (error.code || error.message || "")
    );

  }
}

loadStore();

</script>

</body>
</html>
