<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOKKANI | متجر</title>

<style>
:root{
  --navy:#071426;
  --gold:#d6ad55;
  --gold2:#f0d28b;
  --bg:#f4f6fa;
  --white:#ffffff;
  --muted:#718096;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:var(--bg);
  color:#172338;
  min-height:100vh;
}

header{
  background:var(--navy);
  border-bottom:3px solid var(--gold);
  padding:18px;
}

.header-content{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:white;
}

.logo{
  width:42px;
  height:42px;
  border:1px solid var(--gold);
  border-radius:11px;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:30px 18px;
}

.loading,
.message{
  background:white;
  border-radius:15px;
  padding:35px 20px;
  text-align:center;
  box-shadow:0 5px 25px rgba(0,0,0,.05);
}

.store-card{
  display:none;
  background:white;
  border-radius:18px;
  padding:30px;
  text-align:center;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.store-icon{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:20px;
  background:var(--navy);
  border:2px solid var(--gold);
  display:grid;
  place-items:center;
  color:var(--gold2);
  font-size:30px;
}

.store-card h1{
  margin-top:18px;
  font-size:28px;
  color:var(--navy);
}

.slug{
  color:var(--muted);
  margin-top:8px;
}

.badge{
  display:inline-block;
  margin-top:15px;
  padding:7px 13px;
  border-radius:20px;
  background:#e5f7eb;
  color:#187443;
  font-size:12px;
}

.products-title{
  margin-top:30px;
  font-size:20px;
}

.empty-products{
  margin-top:15px;
  padding:25px;
  background:#f8f9fc;
  border-radius:12px;
  color:var(--muted);
}

footer{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  font-size:12px;
}

.error{
  color:#b42318;
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="brand">
      <div class="logo">D</div>
      <strong>DOKKANI</strong>
    </div>

    <div style="color:#f0d28b;font-size:12px">
      powered by SZ11
    </div>
  </div>
</header>

<div class="container">

  <div id="loading" class="loading">
    جارٍ تحميل المتجر...
  </div>

  <div id="storeCard" class="store-card">

    <div class="store-icon">🏪</div>

    <h1 id="storeName"></h1>

    <div class="slug" id="storeSlug"></div>

    <div class="badge">✓ متجر مفعّل</div>

    <h2 class="products-title">المنتجات</h2>

    <div class="empty-products">
      لا توجد منتجات منشورة حالياً.
    </div>

  </div>

</div>

<footer>
  DOKKANI © 2026 — A project by SZ11
</footer>


<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


const loading = document.getElementById("loading");
const storeCard = document.getElementById("storeCard");

const storeName = document.getElementById("storeName");
const storeSlug = document.getElementById("storeSlug");


async function loadStore(){

  const params = new URLSearchParams(window.location.search);

  const slug = params.get("slug");


  if(!slug){

    loading.innerHTML =
      '<span class="error">لم يتم تحديد رابط المتجر.</span>';

    return;
  }


  try{

    const storesRef = collection(db,"stores");


    const q = query(
      storesRef,
      where("slug","==",slug),
      where("status","==","active")
    );


    const snapshot = await getDocs(q);


    if(snapshot.empty){

      loading.innerHTML =
        '<span class="error">هذا المتجر غير موجود أو غير مفعّل.</span>';

      return;
    }


    const store = snapshot.docs[0].data();


    document.title = store.name + " | DOKKANI";


    storeName.textContent = store.name;

    storeSlug.textContent =
      "dokkani.ma/" + store.slug;


    loading.style.display = "none";

    storeCard.style.display = "block";


  }catch(error){

    console.error(error);

    loading.innerHTML =
      '<span class="error">حدث خطأ أثناء تحميل المتجر.</span>';

  }

}


loadStore();

</script>

</body>
</html>
