
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة البائع | DOKKANI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1424;color:white;font-family:Arial,sans-serif;padding:20px}
.container{max-width:650px;margin:35px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{color:#d6b568}
.card{background:#142238;border:1px solid #b99750;border-radius:16px;padding:22px;margin-top:22px}
label{display:block;margin:15px 0 8px}
input{width:100%;padding:14px;border-radius:8px;border:1px solid #536176;background:#0b1424;color:white;font-size:16px}
button{padding:13px 18px;border:0;border-radius:8px;background:#d6b568;color:#111827;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#message{line-height:1.8;overflow-wrap:anywhere;margin-top:15px}
.muted{color:#bdc6d5}
.store{border-top:1px solid #536176;margin-top:20px;padding-top:15px}
a{color:#d6b568}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>DOKKANI</h1>
  <button id="logout">تسجيل الخروج</button>
</header>

<div class="card">
  <h2>مرحباً بك في لوحة البائع</h2>
  <p class="muted" id="account">جارٍ التحقق من الحساب...</p>
  <div id="storeArea" hidden>
    <h3>متجرك الإلكتروني</h3>
    <div class="store">
      <p id="storeName"></p>
      <p id="storeSlug"></p>
      <p class="muted">تم حفظ بيانات متجرك في Firestore.</p>
    </div>
  </div>
</div>

<div class="card" id="createArea" hidden>
  <h2>إنشاء متجرك</h2>
  <form id="storeForm">
    <label for="name">اسم المتجر</label>
    <input id="name" required minlength="2" maxlength="50"
           placeholder="مثلاً: متجر الأناقة">

    <label for="slug">رابط المتجر المختصر بالإنجليزية</label>
    <input id="slug" required minlength="3" maxlength="25"
           pattern="[a-z0-9-]+"
           placeholder="مثلاً: ahmed-store">

    <button id="createBtn" type="submit">إنشاء المتجر</button>
  </form>
</div>

<div id="message" role="status"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const account = document.getElementById("account");
const message = document.getElementById("message");
const createArea = document.getElementById("createArea");
const storeArea = document.getElementById("storeArea");
const form = document.getElementById("storeForm");
const createBtn = document.getElementById("createBtn");

let currentUser = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  if (!user.emailVerified) {
    await signOut(auth);
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  account.textContent = "الحساب: " + user.email;

  try {
    const storeRef = doc(db, "stores", user.uid);
    const storeSnap = await getDoc(storeRef);

    if (storeSnap.exists()) {
      showStore(storeSnap.data());
    } else {
      createArea.hidden = false;
      message.textContent = "لم تنشئ متجراً بعد. يمكنك إنشاؤه الآن.";
    }
  } catch (error) {
    message.textContent = "تعذر تحميل بيانات المتجر: " + error.message;
  }
});

function showStore(data) {
  createArea.hidden = true;
  storeArea.hidden = false;
  document.getElementById("storeName").textContent =
    "اسم المتجر: " + data.name;
  document.getElementById("storeSlug").textContent =
    "الرابط المختصر: " + data.slug;
  message.textContent = "تم تحميل بيانات متجرك بنجاح.";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!currentUser) return;

  const name = document.getElementById("name").value.trim();
  const slug = document.getElementById("slug").value.trim().toLowerCase();

  if (!/^[a-z0-9-]{3,25}$/.test(slug)) {
    message.textContent =
      "اكتب الرابط بالإنجليزية، بأحرف صغيرة وأرقام وشرطة فقط.";
    return;
  }

  createBtn.disabled = true;
  createBtn.textContent = "جارٍ الإنشاء...";
  message.textContent = "";

  try {
    const storeRef = doc(db, "stores", currentUser.uid);
    const existing = await getDoc(storeRef);

    if (existing.exists()) {
      showStore(existing.data());
      return;
    }

    const storeData = {
      ownerId: currentUser.uid,
      name: name,
      slug: slug,
      createdAt: serverTimestamp(),
      status: "pending"
    };

    await setDoc(storeRef, storeData);

    const userRef = doc(db, "users", currentUser.uid);
    await setDoc(userRef, {
      name: currentUser.displayName || "",
      email: currentUser.email,
      storeId: currentUser.uid,
      updatedAt: serverTimestamp()
    }, { merge: true });

    showStore(storeData);

  } catch (error) {
    message.textContent = "تعذر إنشاء المتجر: " + error.message;
  } finally {
    createBtn.disabled = false;
    createBtn.textContent = "إنشاء المتجر";
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});
</script>
</body>
</html>
