
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | DOKKANI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1424;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #b99750;
      border-radius: 18px;
      background: #142238;
    }
    h1 { text-align: center; color: #d6b568; }
    p { text-align: center; color: #c5cbd5; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #536176;
      background: #0b1424;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #d6b568;
      color: #111827;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #message {
      margin-top: 16px;
      line-height: 1.7;
      text-align: center;
      overflow-wrap: anywhere;
    }
    a { color: #d6b568; }
  </style>
</head>
<body>
  <main class="card">
    <h1>DOKKANI</h1>
    <p>أنشئ حسابك وابدأ متجرك الإلكتروني</p>

    <form id="registerForm">
      <label for="name">اسم البائع</label>
      <input id="name" type="text" required minlength="2"
             placeholder="اسمك الكامل">

      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" required
             placeholder="example@email.com">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required minlength="6"
             placeholder="6 أحرف على الأقل">

      <button id="submitBtn" type="submit">إنشاء الحساب</button>
    </form>

    <div id="message" role="status"></div>
    <p>لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import {
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "جارٍ إنشاء الحساب...";
      message.textContent = "";

      try {
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );

        await updateProfile(result.user, {
          displayName: name
        });

        await sendEmailVerification(result.user);

        message.textContent =
          "تم إنشاء الحساب! أرسلنا رسالة تأكيد إلى بريدك الإلكتروني. تحقق منه ثم سجّل الدخول.";
        form.reset();

      } catch (error) {
        const errors = {
          "auth/email-already-in-use": "هذا البريد مسجل من قبل.",
          "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
          "auth/weak-password": "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.",
          "auth/network-request-failed": "تحقق من اتصال الإنترنت."
        };

        message.textContent =
          errors[error.code] || "حدث خطأ: " + error.message;

      } finally {
        button.disabled = false;
        button.textContent = "إنشاء الحساب";
      }
    });
  </script>
</body>
</html>
