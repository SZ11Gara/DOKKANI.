
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | DOKKANI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1424;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #b99750;
      border-radius: 18px;
      background: #142238;
    }
    h1 { text-align: center; color: #d6b568; }
    p { text-align: center; color: #c5cbd5; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #536176;
      background: #0b1424;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #d6b568;
      color: #111827;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      margin-top: 16px;
      text-align: center;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    a { color: #d6b568; }
  </style>
</head>
<body>
  <main class="card">
    <h1>DOKKANI</h1>
    <p>مرحباً بعودتك إلى متجرك</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" required
             placeholder="example@email.com">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required
             placeholder="كلمة المرور">

      <button id="loginBtn" type="submit">تسجيل الدخول</button>
    </form>

    <div id="message" role="status"></div>

    <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import {
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "جارٍ تسجيل الدخول...";
      message.textContent = "";

      try {
        const result = await signInWithEmailAndPassword(
          auth, email, password
        );

        if (!result.user.emailVerified) {
          await signOut(auth);
          message.textContent =
            "يرجى تأكيد بريدك الإلكتروني أولاً، ثم حاول تسجيل الدخول.";
          return;
        }

        message.textContent = "تم تسجيل الدخول بنجاح!";

        // لوحة البائع ستُربط في الخطوة القادمة.
        window.location.href = "dashboard.html";

      } catch (error) {
        const errors = {
          "auth/invalid-credential": "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
          "auth/user-not-found": "هذا الحساب غير موجود.",
          "auth/wrong-password": "كلمة المرور غير صحيحة.",
          "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
          "auth/too-many-requests": "محاولات كثيرة. حاول لاحقاً."
        };

        message.textContent =
          errors[error.code] || "حدث خطأ: " + error.message;

      } finally {
        button.disabled = false;
        button.textContent = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
