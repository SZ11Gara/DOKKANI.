
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | DOKKANI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      background: white;
      width: 85%;
      max-width: 380px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0001;
    }
    h2 { text-align: center; color: #172554; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #ddd; }
    button {
      border: 0;
      background: #172554;
      color: white;
      font-weight: bold;
    }
    #message {
      text-align: center;
      line-height: 1.7;
      margin-top: 15px;
    }
    a { display: block; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>DOKKANI</h2>
    <p style="text-align:center">تسجيل الدخول إلى حسابك</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني" required>
      <input id="password" type="password" placeholder="كلمة المرور" required>
      <button id="loginBtn" type="submit">تسجيل الدخول</button>
    </form>

    <p id="message"></p>
    <a href="register.html">إنشاء حساب جديد</a>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import {
      signInWithEmailAndPassword,
      sendEmailVerification,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "يرجى الانتظار...";
      message.textContent = "";

      try {
        const result = await signInWithEmailAndPassword(
          auth, email, password
        );

        if (!result.user.emailVerified) {
          await sendEmailVerification(result.user);
          await signOut(auth);

          message.style.color = "#b45309";
          message.textContent =
            "أرسلنا رسالة تأكيد جديدة إلى بريدك. تحقق من صندوق الوارد ومجلد Spam.";
          return;
        }

        message.style.color = "green";
        message.textContent = "تم تسجيل الدخول بنجاح!";
        window.location.href = "dashboard.html";

      } catch (error) {
        console.error(error);
        message.style.color = "red";

        if (error.code === "auth/too-many-requests") {
          message.textContent = "محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.";
        } else if (error.code === "auth/invalid-credential") {
          message.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        } else {
          message.textContent = "حدث خطأ: " + error.code;
        }
      } finally {
        button.disabled = false;
        button.textContent = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
