
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOKKANI | الطلبات</title>
<style>
:root{
  --navy:#071426;
  --navy2:#10243d;
  --gold:#d6ad55;
  --gold2:#f0d28b;
  --bg:#f4f6fa;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:#172438;
}
header{
  background:var(--navy);
  color:white;
  padding:22px 16px;
  border-bottom:3px solid var(--gold);
}
header h2{margin:0;color:var(--gold2)}
header p{margin:8px 0 0;color:#cbd5e1}
main{max-width:900px;margin:25px auto;padding:0 14px}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:18px;
}
button,select{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  font-size:14px;
}
button{
  background:var(--navy);
  color:white;
  cursor:pointer;
}
select{
  border:1px solid #d5dce5;
  background:white;
  color:#172438;
}
.card{
  background:white;
  border:1px solid #e3e8ef;
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 4px 15px #0714260b;
}
.card h3{margin:0 0 12px;color:var(--navy)}
.info{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;
  font-size:14px;
  line-height:1.8;
}
.info span{color:#68778b}
.status{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.message{
  text-align:center;
  padding:25px;
  color:#68778b;
}
a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<header>
  <h2>DOKKANI</h2>
  <p>إدارة طلبات متجرك</p>
</header>

<main>
  <div class="top">
    <h3>📦 طلبات الزبائن</h3>
    <button id="refresh">تحديث الطلبات</button>
  </div>

  <p id="message" class="message">جارٍ تحميل الطلبات...</p>
  <section id="orders"></section>
</main>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const ordersBox = document.getElementById("orders");
const message = document.getElementById("message");
const refresh = document.getElementById("refresh");

const statusNames = {
  new: "جديد",
  processing: "قيد المعالجة",
  completed: "مكتمل",
  cancelled: "ملغى"
};

let currentUser = null;

onAuthStateChanged(auth, async user => {
  if (!user) {
    message.textContent = "يجب تسجيل الدخول أولاً.";
    ordersBox.innerHTML =
      '<p><a href="login.html">الانتقال إلى تسجيل الدخول</a></p>';
    return;
  }

  currentUser = user;
  await loadOrders();
});

async function loadOrders() {
  if (!currentUser) return;

  message.textContent = "جارٍ تحميل الطلبات...";
  ordersBox.innerHTML = "";

  try {
    const q = query(
      collection(db, "orders"),
      where("ownerId", "==", currentUser.uid)
    );

    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      message.textContent = "لا توجد طلبات حالياً.";
      return;
    }

    message.textContent = `عدد الطلبات: ${snapshot.size}`;

    snapshot.forEach(orderDoc => {
      const order = orderDoc.data();
      const date = order.createdAt?.toDate
        ? order.createdAt.toDate().toLocaleString("ar-MA")
        : "غير متوفر";

      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = order.productName || "منتج";
      card.appendChild(title);

      const info = document.createElement("div");
      info.className = "info";

      const details = [
        ["اسم الزبون", order.customerName],
        ["الهاتف", order.customerPhone],
        ["المدينة", order.customerCity],
        ["الكمية", order.quantity],
        ["ثمن الوحدة", `${order.price} DH`],
        ["المجموع", `${Number(order.price) * Number(order.quantity)} DH`],
        ["تاريخ الطلب", date]
      ];

      details.forEach(([label, value]) => {
        const item = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = label + ": ";
        const span = document.createElement("span");
        span.textContent = value ?? "—";
        item.append(strong, span);
        info.appendChild(item);
      });

      card.appendChild(info);

      const statusRow = document.createElement("div");
      statusRow.className = "status";

      const statusLabel = document.createElement("strong");
      statusLabel.textContent = "حالة الطلب:";

      const select = document.createElement("select");

      Object.entries(statusNames).forEach(([value, label]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        select.appendChild(option);
      });

      select.value = statusNames[order.status]
        ? order.status
        : "new";

      select.addEventListener("change", async () => {
        select.disabled = true;
        try {
          await updateDoc(doc(db, "orders", orderDoc.id), {
            status: select.value
          });
          message.textContent = "تم تحديث حالة الطلب بنجاح.";
        } catch (error) {
          alert("تعذر تحديث الحالة: " + error.message);
          select.value = order.status || "new";
        } finally {
          select.disabled = false;
        }
      });

      statusRow.append(statusLabel, select);
      card.appendChild(statusRow);
      ordersBox.appendChild(card);
    });

  } catch (error) {
    message.textContent = "حدث خطأ أثناء تحميل الطلبات: " + error.message;
  }
}

refresh.addEventListener("click", loadOrders);
</script>

</body>
</html>
